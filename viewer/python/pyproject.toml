[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clio-viewer"
version = "0.1.0"
description = "Schematic-style TUI for Clio task hierarchies (Textual implementation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
clio-viewer = "clio_viewer.__main__:main"
clio-jira-import = "clio_viewer.jira_import:main"

[tool.setuptools.packages.find]
include = ["clio_viewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
